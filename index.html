<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Game Center</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>NHL Game Center</h1>
    </div>
  </header>

  <main class="container">
    <nav class="date-nav" aria-label="Choose a game date">
      <button id="previous-day" type="button" aria-label="Previous day">&#8249;</button>
      <h2 id="date-label"></h2>
      <button id="next-day" type="button" aria-label="Next day">&#8250;</button>
    </nav>

    <p id="message" role="status" aria-live="polite">Loading games...</p>
    <section id="games" class="game-grid" aria-label="NHL games"></section>
  </main>
</body>
</html>
